[package]
name = "idealis-oracle"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Portable differential tests, recorded oracle replay and comparative benchmarks"
repository = "https://github.com/mizchi/idealis"
license = "MIT"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "SUPPORT.md", "LICENSE"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
