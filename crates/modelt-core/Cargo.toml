[package]
name = "modelt-core"
version = "0.1.0-alpha.0"
edition = "2024"
description = "Portable finite models, conformance checking and trace replay"
repository = "https://github.com/mizchi/modelt"
readme = "README.md"
include = ["src/**", "examples/counter.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[[bin]]
name = "modelt-core"
path = "src/main.rs"
bench = false

[[bench]]
name = "safety"
path = "src/benchmarks.rs"
harness = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.11"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
