name: Browser compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: true
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm wasm:build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm portable:browser
      - run: pnpm runtime:browser
      - run: pnpm exec playwright test --config oracle-playwright.config.ts
      - run: pnpm exec playwright test --config sat-playwright.config.ts
      - run: pnpm exec playwright test --config testing-playwright.config.ts
      - run: pnpm exec playwright test --config schedules-playwright.config.ts
      - run: pnpm exec playwright test --config fuzz-playwright.config.ts
      - run: pnpm exec playwright test --config smt-playwright.config.ts
      - run: pnpm exec playwright test --config alloy-playwright.config.ts
      - run: pnpm exec playwright test --config alloy-instance-playwright.config.ts
