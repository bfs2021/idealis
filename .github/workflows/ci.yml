name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CI: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: rustup target add wasm32-unknown-unknown
      - run: pnpm check
      - run: pnpm typecheck
      - run: node --experimental-strip-types scripts/check-support.ts
      - run: pnpm test
      - run: node --test dist/scripts/check-support-test.js
      - run: cargo fmt --manifest-path evals/sat-foundation/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/sat-foundation/rust/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path evals/sat-foundation/rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path evals/sat-foundation/rust/Cargo.toml
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown --manifest-path evals/sat-foundation/rust/Cargo.toml
      - run: node --test dist/evals/sat-foundation/contract-test.js
      - run: cargo fmt --manifest-path crates/roracle/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/roracle/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path crates/roracle/Cargo.toml
      - run: cargo test --locked --manifest-path crates/roracle/Cargo.toml --bench wire
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown --manifest-path crates/roracle/Cargo.toml
      - run: cargo build --release --locked --manifest-path crates/roracle/Cargo.toml
      - run: pnpm oracle:types:check
      - run: cargo fmt --manifest-path evals/roracle-native/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/roracle-native/rust/Cargo.toml -- -D warnings
      - run: pnpm oracle:native:build
      - run: pnpm oracle:native:test
      - run: IDEALIS_ORACLE_BACKEND=native-json node --test dist/evals/workspace-oracle/contract-test.js
      - run: IDEALIS_ORACLE_BACKEND=native-object node --test dist/evals/workspace-oracle/contract-test.js
      - run: node dist/scripts/prepare-tlc-modules.js
      - run: node --test dist/evals/tlc-differential/compare-test.js dist/evals/tlc-differential/standard-modules-test.js
      - run: cargo fmt --manifest-path evals/workspace-oracle/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/workspace-oracle/rust/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path evals/workspace-oracle/rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path evals/workspace-oracle/rust/Cargo.toml
      - run: node --test dist/evals/workspace-oracle/contract-test.js
      - run: cargo fmt --manifest-path evals/oracle-comparison/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/oracle-comparison/rust/Cargo.toml -- -D warnings
      - run: cargo build --release --locked --manifest-path evals/oracle-comparison/rust/Cargo.toml
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown --manifest-path evals/oracle-comparison/rust/Cargo.toml
      - run: cargo fmt --manifest-path crates/idealis-testing/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/idealis-testing/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path crates/idealis-testing/Cargo.toml
      - run: pnpm testing:build
      - run: node --test dist/evals/testing-core/contract-test.js
      - run: pnpm exec vp test run --project=testing
      - run: cargo fmt --manifest-path evals/controlled-schedules/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/controlled-schedules/rust/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path evals/controlled-schedules/rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path evals/controlled-schedules/rust/Cargo.toml
      - run: cargo run --release --locked --example loom --manifest-path evals/controlled-schedules/rust/Cargo.toml
      - run: node --test dist/evals/controlled-schedules/contract-test.js
      - run: pnpm exec vp test run --project=schedules
      - run: cargo fmt --manifest-path evals/structured-fuzz/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/structured-fuzz/rust/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path evals/structured-fuzz/rust/Cargo.toml
      - run: cargo build --release --locked --manifest-path evals/structured-fuzz/rust/Cargo.toml
      - run: node --test dist/evals/structured-fuzz/contract-test.js
      - run: pnpm exec vp test run --project=fuzz
      - run: cargo fmt --manifest-path crates/ralloy/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/ralloy/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path crates/ralloy/Cargo.toml
      - run: pnpm ralloy:build
      - run: node --test dist/evals/alloy-subset/contract-test.js
      - run: node --test dist/evals/alloy-instance/contract-test.js
      - run: pnpm exec vp test run --project=alloy
      - run: cargo fmt --manifest-path crates/idealis-smt/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/idealis-smt/Cargo.toml -- -D warnings
      - run: cargo test --all-targets --locked --manifest-path crates/idealis-smt/Cargo.toml
      - run: cargo build --release --locked --manifest-path crates/idealis-smt/Cargo.toml
      - run: cargo build --release --locked --lib --target wasm32-unknown-unknown --manifest-path crates/idealis-smt/Cargo.toml
      - run: node --test dist/evals/smt-subset/contract-test.js dist/evals/smt-expansion/contract-test.js dist/evals/smt-scripts/contract-test.js dist/evals/smt-tuning/contract-test.js
      - run: pnpm exec vp test run --project=smt
      - run: cargo fmt --manifest-path crates/idealis-core/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path crates/idealis-core/Cargo.toml -- -D warnings
      - run: pnpm portable:build
      - run: pnpm rtla:build
      - run: node --test dist/evals/oracle-tuning/wasm-test.js
      - run: node --test dist/evals/rtla-compatibility/contract-test.js dist/evals/symbolic-operators/contract-test.js
      - run: cargo build --locked --manifest-path crates/rtla-compiler/Cargo.toml --example analysis_roles
      - run: node --test dist/evals/tlc-differential/analysis-parity-test.js dist/evals/tlc-differential/frame-decoder-test.js dist/evals/p0-checker/contract-test.js
      - run: node dist/evals/rtla-compiler/evaluate.js .artifacts/rtla-compiler
      - run: node --test dist/evals/quint-generated/contract-test.js
      - run: node --test dist/evals/frontier-safety/contract-test.js
      - run: node --test dist/evals/readme-comparison/contract-test.js
      - run: node --test dist/evals/rust-safety/contract-test.js dist/evals/collections-temporal/contract-test.js dist/evals/tlc-differential/compare-test.js dist/evals/tlc-differential/regression-test.js dist/evals/parallel-safety/contract-test.js
      - run: node dist/evals/collections-temporal/evaluate.js .artifacts/collections-temporal
      - run: node dist/evals/collections-temporal/replay.js .artifacts/collections-temporal
      - run: node dist/evals/rust-safety/evaluate.js .artifacts/rust-safety
      - run: node dist/evals/rust-safety/replay.js .artifacts/rust-safety
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.25.x
          cache-dependency-path: adapters/go/go.sum
      - run: node dist/evals/go/prepare.js
      - run: test -z "$(gofmt -l adapters/go)"
      - run: go mod verify && go vet ./...
        working-directory: adapters/go
      - run: CGO_ENABLED=0 go test -count=1 ./...
        working-directory: adapters/go
      - run: go test -race -count=1 ./...
        working-directory: adapters/go
      - run: node dist/scripts/go-consumer.js
      - run: cargo fmt --manifest-path evals/shared-oracle-rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path evals/shared-oracle-rust/Cargo.toml -- -D warnings
      - run: cargo build --release --locked --manifest-path evals/shared-oracle-rust/Cargo.toml
      - run: CGO_ENABLED=0 go build -o ../../.artifacts/go/counter-replay ./cmd/counter-replay
        working-directory: adapters/go
      - run: node --test dist/evals/cross-language/contract-test.js
      - run: node dist/evals/cross-language/evaluate.js regression .artifacts/shared-oracle
      - run: node dist/evals/cross-language/replay.js .artifacts/shared-oracle
      - run: CGO_ENABLED=0 go build -o ../../.artifacts/go/history-check ./cmd/history-check
        working-directory: adapters/go
      - run: CGO_ENABLED=0 go build -o ../../.artifacts/go/finite-bench ./cmd/finite-bench
        working-directory: adapters/go
      - run: node --test dist/evals/async-tuning/contract-test.js
      - run: node dist/evals/async-tuning/evaluate.js regression .artifacts/async-tuning
      - run: node dist/evals/async-tuning/replay.js .artifacts/async-tuning
      - run: pnpm portable:test
      - run: node --test dist/evals/workspace-oracle/catalog-test.js
      - run: pnpm usable:test
      - run: pnpm runtime:build
      - run: pnpm runtime:test
      - run: pnpm wasm:test
      - run: pnpm test:mutation
      - run: pnpm evaluate
      - run: pnpm evaluate:replay
      - run: pnpm eval:loop evals/plans/0002-mixed-depth.json ci-mixed .artifacts/evals
      - run: pnpm eval:replay .artifacts/evals/ci-mixed-confirmation
      - run: node dist/scripts/package.js
      - run: pnpm package:test
      - run: pnpm usable:eval .artifacts/usable-evaluation
      - run: pnpm usable:replay .artifacts/usable-evaluation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: verification-evidence
          path: |
            .mutator/report
            .artifacts/evaluation
            .artifacts/evals
            .artifacts/usable-evaluation
            .artifacts/packages
            .artifacts/go
            .artifacts/shared-oracle
            .artifacts/async-tuning
            .artifacts/rust-safety
            .artifacts/collections-temporal
            .artifacts/frontier-safety
            .artifacts/readme-comparison
            .artifacts/rtla-compiler
          if-no-files-found: warn
